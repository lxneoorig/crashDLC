<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRASH DLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #1a0a2e;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .box {
            background: #2d1b4e;
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid #7b3fbf;
            box-shadow: 0 0 50px rgba(123, 63, 191, 0.3);
            max-width: 450px;
            width: 100%;
        }
        h1 {
            font-size: 40px;
            color: #c084fc;
            margin-bottom: 6px;
        }
        .sub {
            color: #a78bfa;
            font-size: 18px;
            margin-bottom: 6px;
        }
        .version {
            color: #7b3fbf;
            font-size: 14px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .btn {
            display: inline-block;
            padding: 16px 50px;
            background: #7b3fbf;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            width: 100%;
        }
        .btn:hover {
            background: #9b5fd9;
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(123, 63, 191, 0.5);
        }
        .status {
            margin-top: 20px;
            color: #a78bfa;
            font-size: 14px;
        }
        .status .online {
            color: #2ecc71;
        }
        .footer {
            color: #5b3f7f;
            font-size: 13px;
            margin-top: 20px;
        }
        #msg {
            margin-top: 15px;
            color: #a78bfa;
            font-size: 14px;
            min-height: 20px;
        }
        .beta-badge {
            display: inline-block;
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(46, 204, 113, 0.2);
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🚀 CRASH DLC</h1>
        <div class="sub">Установи клиент</div>
        <div class="version">Cheat 1.21.4 / 1.21.11 <span class="beta-badge">BETA TEST</span></div>

        <a href="#" class="btn" onclick="install()">📥 Установить</a>

        <div id="msg"></div>

        <div class="status">
            <span class="online">●</span> Сервер: <span class="online">онлайн</span>
        </div>
    </div>

    <div class="footer">© 2026 CRASH DLC</div>

    <script>
        function install() {
            document.getElementById('msg').textContent = '✅ Установка началась...';
        }
    </script>
</body>
</html>

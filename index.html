<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CRASH DLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #1a0a2e;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .box {
            background: #2d1b4e;
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid #7b3fbf;
            box-shadow: 0 0 50px rgba(123, 63, 191, 0.3);
            max-width: 450px;
            width: 100%;
        }
        h1 {
            font-size: 40px;
            color: #c084fc;
            margin-bottom: 6px;
        }
        .sub {
            color: #a78bfa;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .versions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .versions span {
            background: #3d2b5e;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            color: #c084fc;
            border: 1px solid #7b3fbf;
        }
        .btn {
            display: inline-block;
            padding: 16px 50px;
            background: #3d2b5e;
            color: #7b5f9f;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: not-allowed;
            text-decoration: none;
            width: 100%;
            opacity: 0.5;
        }
        .btn-lock {
            display: inline-block;
            padding: 16px 50px;
            background: #3d2b5e;
            color: #7b5f9f;
            border: 2px solid #5b3f7f;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: not-allowed;
            text-decoration: none;
            width: 100%;
            opacity: 0.5;
            pointer-events: none;
        }
        .btn-lock::after {
            content: " 🔒";
            color: #7b5f9f;
        }
        .dev-note {
            margin-top: 10px;
            color: #f39c12;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .dev-note span {
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        #msg {
            margin-top: 10px;
            color: #a78bfa;
            font-size: 14px;
            min-height: 20px;
        }

        /* ===== НОВАЯ КНОПКА СООБЩЕСТВА ===== */
        .btn-community {
            display: inline-block;
            padding: 14px 40px;
            background: #7b3fbf;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            width: 100%;
            margin-top: 12px;
        }
        .btn-community:hover {
            background: #9b5fd9;
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(123, 63, 191, 0.5);
        }

        .status {
            margin-top: 18px;
            font-size: 13px;
            color: #7b5f9f;
        }
        .status .online {
            color: #2ecc71;
        }
        .links {
            margin-top: 18px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .links a {
            color: #c084fc;
            text-decoration: none;
            font-size: 14px;
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid #7b3fbf;
            transition: 0.3s;
        }
        .links a:hover {
            background: #7b3fbf;
            color: #fff;
        }
        .footer {
            color: #5b3f7f;
            font-size: 13px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🚀 CRASH DLC</h1>
        <div class="sub">Установи клиент и участвуй в бета-тесте</div>

        <div class="versions">
            <span>⚡ 1.21.4</span>
            <span>⚡ 1.21.11</span>
            <span>🧪 BETA TEST</span>
        </div>

        <!-- ЗАБЛОКИРОВАННАЯ КНОПКА -->
        <div class="btn-lock">📥 Установить</div>
        <div class="dev-note"><span>⏳ В разработке...</span></div>

        <!-- ===== НОВАЯ КНОПКА СООБЩЕСТВА ===== -->
        <a href="https://lx-dls.github.io/" target="_blank" class="btn-community">🌐 Сообщество</a>

        <div id="msg"></div>

        <div class="status">
            <span class="online">●</span> Сервер: <span class="online">онлайн</span>
        </div>

        <div class="links">
            <a href="https://discord.gg/DanFgwuyd" target="_blank">💬 Discord</a>
            <a href="https://t.me/crashDLC" target="_blank">📲 Telegram</a>
        </div>
    </div>

    <div class="footer">© 2026 CRASH DLC</div>
</body>
</html>

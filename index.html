<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crash DLC</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            text-align: center;
            border: 1px solid #e94560;
            box-shadow: 0 0 40px rgba(233, 69, 96, 0.3);
        }
        h1 {
            font-size: 3em;
            color: #e94560;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }
        .version {
            background: #16213e;
            padding: 8px 25px;
            border-radius: 30px;
            color: #f5a623;
            display: inline-block;
        }
        ul {
            text-align: left;
            list-style: none;
            padding: 0;
        }
        ul li {
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }
        ul li:before {
            content: "⚡ ";
            color: #e94560;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            margin: 10px;
            background: #e94560;
            color: #fff;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background: #c73652;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.5);
        }
        .btn-gray {
            background: #2a2a4a;
        }
        .btn-gray:hover {
            background: #3a3a5a;
        }
        .footer {
            margin-top: 20px;
            color: #666;
            font-size: 0.8em;
        }
        .status {
            color: #4caf50;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CRASH DLC</h1>
        <p style="color:#aaa;">⚔️ Minecraft Client</p>
        <div class="version">v2.5.0 — 1.8 – 1.20</div>
        <p class="status">✅ Рабочий чит • Анти-бан</p>
        <ul>
            <li>Автокликер (LMB / RMB)</li>
            <li>Автофарм ресурсов</li>
            <li>X-Ray без банов</li>
            <li>Fly / Speed / NoFall</li>
            <li>Анти-бан система</li>
            <li>ScreenShare защита</li>
        </ul>
        <div>
            <a href="#" class="btn">⬇ Скачать чит</a>
            <a href="#" class="btn btn-gray">📖 Гайд</a>
        </div>
        <div class="footer">🔒 Работает на всех серверах • Постоянные обновления</div>
    </div>
</body>
</html>

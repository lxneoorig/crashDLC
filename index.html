<!DOCTYPE html>
<html>
<head>
    <title>Crash DLC</title>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial;
            background: #0a0a12;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            margin: 0;
        }
        .box {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #333;
            min-width: 300px;
        }
        h1 {
            color: #ff6b35;
            font-size: 36px;
            margin-bottom: 10px;
        }
        p {
            color: #888;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0a0a12;
            color: white;
            font-size: 16px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #ff6b35;
            outline: none;
        }
        button {
            width: 100%;
            background: #ff6b35;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover {
            background: #ff8255;
            transform: scale(1.02);
        }
        #msg {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
        }
        .success {
            color: #2ecc71;
        }
        .error {
            color: #e74c3c;
        }
        .hidden {
            display: none;
        }
        #dashboard {
            margin-top: 20px;
            padding: 20px;
            background: #1a1a2e;
            border-radius: 12px;
            border: 1px solid #2ecc71;
        }
        #dashboard h2 {
            color: #2ecc71;
        }
        .logout-btn {
            background: #e74c3c;
            margin-top: 10px;
        }
        .logout-btn:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>

<div class="box" id="loginBox">
    <h1>CRASH DLC</h1>
    <p>Войди в свой аккаунт</p>
    
    <input type="text" id="loginInput" placeholder="Логин">
    <input type="password" id="passInput" placeholder="Пароль">
    
    <button onclick="login()">🔑 Войти</button>
    
    <div id="msg"></div>
</div>

<div class="hidden" id="dashboard">
    <h2>✅ Добро пожаловать!</h2>
    <p id="userName" style="color: #ff6b35; font-size: 20px;"></p>
    <p id="userRole" style="color: #888;"></p>
    <button class="logout-btn" onclick="logout()">🚪 Выйти</button>
</div>

<script>
    // ===== СПИСОК ПОЛЬЗОВАТЕЛЕЙ =====
    const users = [
        { name: 'lxneo', password: '1234', role: 'admin' },
        { name: 'fridiz', password: '1234', role: 'admin' },
        { name: 'user1', password: '1234', role: 'user' },
        { name: 'user2', password: '1234', role: 'user' }
    ];

    function login() {
        const loginInput = document.getElementById('loginInput').value.trim();
        const passInput = document.getElementById('passInput').value.trim();
        const msg = document.getElementById('msg');

        // Проверяем, что поля не пустые
        if (loginInput === '' || passInput === '') {
            msg.textContent = '❌ Заполни все поля!';
            msg.className = 'error';
            return;
        }

        // Ищем пользователя
        const found = users.find(u => u.name === loginInput && u.password === passInput);

        if (found) {
            msg.textContent = '✅ Вход выполнен!';
            msg.className = 'success';
            
            // Показываем панель
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            
            document.getElementById('userName').textContent = '👤 ' + found.name;
            document.getElementById('userRole').textContent = 'Роль: ' + (found.role === 'admin' ? '👑 Администратор' : '🎮 Игрок');
        } else {
            msg.textContent = '❌ Неверный логин или пароль!';
            msg.className = 'error';
        }
    }

    function logout() {
        document.getElementById('loginBox').classList.remove('hidden');
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('loginInput').value = '';
        document.getElementById('passInput').value = '';
        document.getElementById('msg').textContent = '';
    }

    // Нажатие Enter для входа
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            login();
        }
    });
</script>

</body>
</html>

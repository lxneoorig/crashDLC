<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Установка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #1a0a2e;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .box {
            background: #2d1b4e;
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid #7b3fbf;
            box-shadow: 0 0 50px rgba(123, 63, 191, 0.3);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 36px;
            color: #c084fc;
            margin-bottom: 10px;
        }
        p {
            color: #a78bfa;
            font-size: 16px;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            padding: 14px 40px;
            background: #7b3fbf;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            margin: 6px 0;
            width: 100%;
        }
        .btn:hover {
            background: #9b5fd9;
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(123, 63, 191, 0.5);
        }
        .btn-green {
            background: #2ecc71;
        }
        .btn-green:hover {
            background: #27ae60;
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.4);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #7b3fbf;
        }
        .btn-outline:hover {
            background: #7b3fbf;
        }
        .footer {
            color: #5b3f7f;
            font-size: 13px;
            margin-top: 20px;
        }
        #msg {
            margin-top: 15px;
            color: #a78bfa;
            font-size: 14px;
            min-height: 20px;
        }
        .beta-box {
            margin-top: 15px;
            padding: 12px;
            background: rgba(123, 63, 191, 0.15);
            border-radius: 10px;
            border: 1px dashed #7b3fbf;
        }
        .beta-box label {
            color: #c084fc;
            font-size: 14px;
            display: block;
            margin-bottom: 6px;
        }
        .beta-box input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #7b3fbf;
            background: #1a0a2e;
            color: #fff;
            font-size: 14px;
            text-align: center;
        }
        .beta-box input:focus {
            outline: none;
            border-color: #c084fc;
        }
        .status {
            margin-top: 10px;
            font-size: 13px;
        }
        .status .online {
            color: #2ecc71;
        }
        .status .offline {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🚀 CRASH DLC</h1>
        <p>Установи клиент и участвуй в бета-тесте</p>

        <!-- КНОПКА УСТАНОВКИ -->
        <a href="#" class="btn" onclick="install()">📥 Установить</a>

        <!-- БЕТА-ТЕСТ -->
        <div class="beta-box">
            <label>🔬 Бета-тест</label>
            <input type="text" id="betaCode" placeholder="Введи код бета-теста">
            <button onclick="betaTest()" class="btn btn-green" style="margin-top:8px;">✅ Активировать бета</button>
            <div id="betaMsg" style="color:#a78bfa; font-size:13px; margin-top:6px;"></div>
        </div>

        <div id="msg"></div>

        <div class="status">
            <span class="online">●</span> Сервер: <span class="online">онлайн</span>
        </div>
    </div>

    <div class="footer">© 2026 CRASH DLC</div>

    <script>
        function install() {
            document.getElementById('msg').textContent = '✅ Установка началась...';
        }

        function betaTest() {
            const code = document.getElementById('betaCode').value.trim();
            const msg = document.getElementById('betaMsg');

            if (!code) {
                msg.textContent = '❌ Введи код бета-теста!';
                msg.style.color = '#e74c3c';
                return;
            }

            if (code === 'BETA2026') {
                msg.textContent = '✅ Бета-тест активирован! Добро пожаловать!';
                msg.style.color = '#2ecc71';
            } else {
                msg.textContent = '❌ Неверный код! Попробуй ещё.';
                msg.style.color = '#e74c3c';
            }
        }
    </script>
</body>
</html>
